---
layout: default
title: Home
---

{% for post in site.posts %}
<div class="row">
    <div class="span3">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <div><em>Posted on {{ post.date | date_to_long_string }}.</em></div>
    </div>
    <div class="span3">
        <div><em>Filed under {{ post.categories | category_links }}</em></div>
    </div>
</div>
<hr>

{% endfor %}
