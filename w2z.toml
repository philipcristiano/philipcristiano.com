[templates]
[templates.note]
input_fields = [
    {name = "body", type = "text"},
    {name = "date", type = "datetime", default_now = true},
    {name = "taxonomies", type = "object", input_fields = [ {name = "tags", type = "list", list_of_type = "string" } ], required = false},
]
path = "content/notes/{{ now() | date(format=\"%Y/%Y%m%d%H%M%S\")}}/index.md"

[templates.reply]
input_fields = [
    {name = "body", type = "text"},
    {name = "date", type = "datetime", default_now = true},
    {name = "taxonomies", type = "object", input_fields = [ {name = "tags", type = "list", list_of_type = "string" }], required = false},
    {name = "extra", type = "object", input_fields = [ {name = "in_reply_to", type = "string"} ]},
]
path = "content/replies/{{ now() | date(format=\"%Y/%Y%m%d%H%M%S\")}}/index.md"

[templates.like]
input_fields = [
    {name = "body", type = "text"},
    {name = "date", type = "datetime", default_now = true},
    {name = "taxonomies", type = "object", input_fields = [ {name = "tags", type = "list", list_of_type = "string" }], required = false},
    {name = "extra", type = "object", input_fields = [ {name = "in_like_of", type = "string"}]},
]
path = "content/likes/{{ now() | date(format=\"%Y/%Y%m%d%H%M%S\")}}/index.md"

[templates.recommendations]
path = "content/recommendations/{{slug}}.md"
input_fields = [
    {name = "slug", type = "string"},
    {name = "title", type = "string"},
    {name = "date", type = "datetime", default_now = true},
    {name = "extra", type = "object", input_fields = [ {name = "url", type = "string"}, {name = "feed", type = "string"}
    ]},
]

[templates.err]
input_fields = [
    {name = "body", type = "text"},
    {name = "in_like_of", type = "string"},
]
path = "content/likes/{{ /index.md"
