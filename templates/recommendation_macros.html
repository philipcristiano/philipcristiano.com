{% import "short.html" as short %}

{% macro recommendation(page) %}
<div class="feed-entry rec-card h-entry">
  {{ short::u_author() }}
  {{ short::card_header(page=page, type="rec") }}
  <div class="feed-entry-header">
    <a href="{{ page.extra.url }}">{{ page.title }}</a>
  </div>
  {% if page.content %}
  <div class="prose e-content">
    {{ page.content | safe }}
  </div>
  {% endif %}
  {{ short::page_tags(page=page) }}
</div>
{% endmacro recommendation %}
