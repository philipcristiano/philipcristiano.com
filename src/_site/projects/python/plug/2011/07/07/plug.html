<p>Release v0.1.1 adds an <code>uninstall</code> command to Plug that takes a <code>--plug=</code> option and removes the virtualenv and all runit links.</p>

<p>You can get <a href='http://pypi.python.org/pypi/plug'>Plug</a> on PyPi and try it out. As always, <a href='http://github.com/philipcristiano/plug/issues'>report any issues</a>.</p>
