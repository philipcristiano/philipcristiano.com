version: 2
jobs:
  build_and_deploy:
    docker:
      - image: circleci/python:2
    steps:
      - checkout
      - run: sudo pip install -r requirements.txt
      - run: make build
      - run: sudo pip install awscli
      - run: make upload

workflows:
  version: 2
  build_and_test:
    jobs:
      - build_and_deploy:
          filters:
            branches:
              only: master
