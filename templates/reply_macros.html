{% import "short.html" as short %}

{% macro reply(page) %}
<div class="feed-entry reply-card h-entry">
  {{ short::u_author() }}
  {{ short::card_header(page=page, type="reply") }}
  <div class="reply-card-context">
    <a class="u-in-reply-to reply-url" href="{{ page.extra.in_reply_to }}">{{ page.extra.in_reply_to }}</a>
  </div>
  <div class="prose e-content">
    {{ page.content | safe }}
  </div>
  {{ short::page_tags(page=page) }}
</div>
{% endmacro reply %}
