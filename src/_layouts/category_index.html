---
layout: default
---
<ul class="posts">
{% for post in site.categories[page.category] %}
    <h4><a href="{{ post.url }}">{{ post.title }}</a></h4>
    <div><em>Posted on {{ post.date | date_to_long_string }}.</em></div>
    <div class="categories">Filed under {{ post.categories | category_links }}</div>
{% endfor %}
</ul>
