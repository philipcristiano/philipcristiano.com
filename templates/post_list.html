{% extends "base.html" %}

{% block body %}
{% for page in pages %}
<div class="row">
    <div class="row">
        <div class="span8">
            <h2><a href="{{ page.id }}.html">{{ page.title }}</a></h2>
            <div><em>Posted on {{ page.date | date_to_long_string }}.</em></div>
        </div>
    </div>
    <div class="row">
        <div class="span8">
            <div><em>{% if page.tags != "undefined" %}Filed under {{ page.tags | tag_links }}{% endif %} </em></div>
        </div>
    </div>
</div>
<hr>

{% endfor %}

{% endblock %}
