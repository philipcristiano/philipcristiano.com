{% import "short.html" as short %}

{% macro like(page) %}
<div class="feed-entry like-card h-entry">
  {{ short::u_author() }}
  {{ short::card_header(page=page, type="like") }}
  <a class="u-like-of like-url" href="{{ page.extra.in_like_of }}">{{ page.extra.in_like_of }}</a>
  {% if page.content %}
  <div class="prose e-content">
    {{ page.content | safe }}
  </div>
  {% endif %}
  {{ short::page_tags(page=page) }}
</div>
{% endmacro like %}
