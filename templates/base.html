<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
    <title>{{ config.title }}</title>
	<meta name="description" content="">
	<meta name="author" content="Philip Cristiano">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<link rel="stylesheet" href="/site.css" />
  <link type="application/atom+xml" rel="alternate" href="/atom.xml" title="philipcristiano.com - All items"/>
  <link type="application/atom+xml" rel="alternate" href="/posts/atom.xml" title="philipcristiano.com - posts"/>
  <link type="application/atom+xml" rel="alternate" href="/notes/atom.xml" title="philipcristiano.com - notes"/>
  <link rel="webmention" href="https://webmention.io/philipcristiano.com/webmention" />

  <link href="https://github.com/philipcristiano" rel="me">
  {% block header %}
  {% endblock %}

</head>

<body>
    <nav class="nav bg-gray-100">
        <div class="flex lg:flex-1 m-3">
                <div class="h-card">
                  <a class="no-underline hover:no-underline font-extrabold m-3 text-2xl p-name u-url" href="/">{{ config.author }}</a>
                  <a class="u-photo" href="{{ get_url(path="/photos/me/me-2023.jpg", cachebust=true)}}"></a>
                </div>
                <span class="list-reset lg:flex justify-end flex-1 items-center">
                    <span class="bg-white rounded px-2 m-2 border border-slate-600"><a class="no-underline" href="/atom.xml">Feed</a></span>
                    <span class="bg-white rounded px-2 m-2 border border-slate-600"><a class="no-underline" href="http://github.com/philipcristiano">Github</a></span>
                </span>
        </div>
    </nav>
    <div class="container w-full md:max-w-3xl mx-auto pt-20 place-content-center">
        <div class="w-full px-4 md:px-6  leading-normal">
            <div class="span8 h-feed">
                {% block body %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
