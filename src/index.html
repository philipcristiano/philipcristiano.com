---
layout: default
title: Posts
---

{% for post in site.posts %}
<div class="row">
    <div class="row">
        <div class="span8">
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <div><em>Posted on {{ post.date | date_to_long_string }}.</em></div>
        </div>
    </div>
    <div class="row">
        <div class="span8">
            <div><em>Filed under {{ post.tags | tag_links }}</em></div>
        </div>
    </div>
</div>
<hr>

{% endfor %}
