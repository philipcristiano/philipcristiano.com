media: "src/media"
content:
  - name: posts
    label: Posts
    path: content/posts
    type: collection
    filename: '{year}-{month}-{day}-{primary}.md'
    format: toml-frontmatter
    fields:
      - name: title
        type: string
        label: Title
        options:
          minlength: 20
          maxlength: 160