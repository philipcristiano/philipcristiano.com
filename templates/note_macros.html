{% import "short.html" as short %}

{% macro note(page) %}
<div class="feed-entry note-card h-entry">
  {{ short::u_author() }}
  {{ short::card_header(page=page, type="note") }}
  <div class="prose e-content">
    {{ page.content | safe }}
  </div>
  {{ short::page_tags(page=page) }}
</div>
{% endmacro note %}
